[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"

# Routes and legacy redirects are defined in public/_redirects.
# Known pages have static HTML; unknown paths serve the branded 404 page.

# Security headers (we'll add CSP back later once deployment works)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"